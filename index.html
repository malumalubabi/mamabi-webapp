<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MaluMaluBabi WebApp</title>
  <meta name="theme-color" content="#1B2833">
  <link rel="manifest" href="/manifest.json">
  <!-- Favicon (browser tab, next to the page title) uses the transparent
       Logo B - blends into the tab strip regardless of light/dark browser
       theme. The installed-app icon (manifest.json/apple-touch-icon below)
       stays the gradient version - that one needs to read as a solid tile
       on a home screen, not blend into anything. -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/nobg/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/nobg/favicon-16.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <!-- Quicksand - used only for the header title (see shared.css's
       "header h2"), not applied app-wide. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared.css">
</head>
<body>

  <header>
    <h2><img src="/assets/icons/nobg/icon-192.png" alt="" class="brand-icon"> <span class="brand-name">MaluMaluBabi</span> <span class="brand-suffix">WebApp</span></h2>
  </header>

  <nav id="navbar">

    <button data-page="dashboard" onclick="navigateTo('dashboard'); closeNavDropdowns();">
      Dashboard
    </button>

    <div class="navbar-item">
      <button onclick="toggleNavDropdown(this)">Finance &#9662;</button>
      <div class="navbar-dropdown">
        <button data-page="finance" data-tab="cashflow" onclick="navigateTo('finance?tab=cashflow'); closeNavDropdowns();">Cashflow</button>
        <button data-page="finance" data-tab="opex" onclick="navigateTo('finance?tab=opex'); closeNavDropdowns();">OpEx</button>
        <button data-page="finance" data-tab="pnl" onclick="navigateTo('finance?tab=pnl'); closeNavDropdowns();">P&amp;L</button>
      </div>
    </div>

    <button data-page="sales" onclick="navigateTo('sales'); closeNavDropdowns();">
      Sales
    </button>

    <div class="navbar-item">
      <button onclick="toggleNavDropdown(this)">Inventory &#9662;</button>
      <div class="navbar-dropdown">
        <button data-page="inventory" data-tab="stock" onclick="navigateTo('inventory?tab=stock'); closeNavDropdowns();">Inventory Stock</button>
        <button data-page="inventory" data-tab="cost" onclick="navigateTo('inventory?tab=cost'); closeNavDropdowns();">Inventory Cost</button>
      </div>
    </div>

    <div class="navbar-item">
      <button onclick="toggleNavDropdown(this)">Orders &#9662;</button>
      <div class="navbar-dropdown">
        <button data-page="orders" data-tab="platform" onclick="navigateTo('orders?tab=platform'); closeNavDropdowns();">Platform Orders</button>
        <button data-page="orders" data-tab="online" onclick="navigateTo('orders?tab=online'); closeNavDropdowns();">Online Orders</button>
        <button data-page="orders" data-tab="dinein" onclick="navigateTo('orders?tab=dinein'); closeNavDropdowns();">Dine-In</button>
        <button data-page="orders" data-tab="payout" onclick="navigateTo('orders?tab=payout'); closeNavDropdowns();">Driver Payout</button>
      </div>
    </div>

    <div class="navbar-item">
      <button onclick="toggleNavDropdown(this)">Menu &#9662;</button>
      <div class="navbar-dropdown">
        <button data-page="menu" data-tab="batch" onclick="navigateTo('menu?tab=batch'); closeNavDropdowns();">Batch Production</button>
        <div class="navbar-subitem">
          <button onclick="toggleNavSubmenu(this, event)">Menu Engineering</button>
          <div class="navbar-subdropdown">
            <button data-page="menu" data-tab="pricing" onclick="navigateTo('menu?tab=pricing'); closeNavDropdowns();">Pricing</button>
            <button data-page="menu" data-tab="platform" onclick="navigateTo('menu?tab=platform'); closeNavDropdowns();">Platform Pricing</button>
            <button data-page="menu" data-tab="costing" onclick="navigateTo('menu?tab=costing'); closeNavDropdowns();">Costing</button>
          </div>
        </div>
      </div>
    </div>

    <div class="navbar-item">
      <button onclick="toggleNavDropdown(this)">Database &#9662;</button>
      <div class="navbar-dropdown">
        <div class="navbar-subitem">
          <button onclick="toggleNavSubmenu(this, event)">SKU</button>
          <div class="navbar-subdropdown">
            <button data-page="database" data-tab="sku-Ingredient" onclick="navigateTo('database?tab=sku-Ingredient'); closeNavDropdowns();">Ingredient</button>
            <button data-page="database" data-tab="sku-Packaging" onclick="navigateTo('database?tab=sku-Packaging'); closeNavDropdowns();">Packaging</button>
            <button data-page="database" data-tab="sku-Operating" onclick="navigateTo('database?tab=sku-Operating'); closeNavDropdowns();">Operating</button>
            <button data-page="database" data-tab="sku-Product" onclick="navigateTo('database?tab=sku-Product'); closeNavDropdowns();">Product</button>
            <button data-page="database" data-tab="sku-Component" onclick="navigateTo('database?tab=sku-Component'); closeNavDropdowns();">Component</button>
            <button data-page="database" data-tab="sku-Semi-Finished" onclick="navigateTo('database?tab=sku-Semi-Finished'); closeNavDropdowns();">Semi-Finished</button>
          </div>
        </div>
        <button data-page="database" data-tab="supplier" onclick="navigateTo('database?tab=supplier'); closeNavDropdowns();">Supplier</button>
        <button data-page="database" data-tab="customer" onclick="navigateTo('database?tab=customer'); closeNavDropdowns();">Customer</button>
        <button data-page="database" data-tab="staff" onclick="navigateTo('database?tab=staff'); closeNavDropdowns();">Staff</button>
      </div>
    </div>

    <button data-page="settings" onclick="navigateTo('settings'); closeNavDropdowns();">
      Settings
    </button>

  </nav>

  <main id="content">
    <p>Loading...</p>
  </main>

  <footer>
    <hr>
    <p>&copy; MaMaBi System</p>
  </footer>

  <script src="/shared.js"></script>
  <script src="/pages/dashboard.js"></script>
  <script src="/pages/orders.js"></script>
  <script src="/pages/inventory.js"></script>
  <script src="/pages/menu.js"></script>
  <script src="/pages/cashflow.js"></script>
  <script src="/pages/opex.js"></script>
  <script src="/pages/pnl.js"></script>
  <script src="/pages/sales.js"></script>
  <script src="/pages/database.js"></script>
  <script src="/pages/settings.js"></script>
  <script>
    // Loaded before the first render so formatRupiah/formatPhoneDisplay/
    // todayISO already reflect Settings > General on every page, not just
    // after some later re-render (see shared.js's ensureGeneralSettings).
    ensureGeneralSettings().then(renderCurrentPage);

    // #navbar is static markup (not re-rendered per page like #content),
    // so this only needs to run once - shared.css's overflow-x:auto lets it
    // scroll on a narrow/mobile viewport instead of spilling off-screen,
    // this adds click-and-drag on top of that (same helper Stock Opname's
    // wide table uses).
    enableDragScroll(document.getElementById("navbar"));

    // Registered after load so it never competes with the page's own
    // first-paint scripts above - installability only needs it registered
    // at some point, not immediately.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
    }
  </script>

</body>
</html>
